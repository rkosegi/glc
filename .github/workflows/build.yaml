---
name: Build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: rkosegi/github-workflows/.github/workflows/go-ci.yaml@a6c35f88b007c59deae41f7c1c8fa3fd7634bc67 # v0.0.12
    with:
      goreleaser: true
